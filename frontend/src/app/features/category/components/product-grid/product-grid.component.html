<div class="product-grid">

  <!-- Phần đầu -->
  <div class="product-grid-header">
    <div class="product-count">
      Hiển thị {{ visibleProducts.length }}/{{ totalProducts }} sản phẩm
    </div>
    <div class="product-sort">
      <label for="sort">Sắp xếp theo:</label>
      <select id="sort" [ngModel]="selectedSort" (ngModelChange)="onSortChange($event)">
        <option value="popularity">Phổ biến nhất</option>
        <option value="priceAsc">Giá tăng dần</option>
        <option value="priceDesc">Giá giảm dần</option>
        <option value="newest">Mới nhất</option>
      </select>
    </div>
  </div>

  <!-- Phần giữa -->
  <div class="product-grid-body">
    <div class="product-list">
      <app-product-card
        *ngFor="let product of visibleProducts; trackBy: trackByProductId"
        [product]="product">
      </app-product-card>
    </div>
  </div>

  <!-- Phần cuối -->
  <div class="product-grid-footer">
    <button class="load-more" (click)="onLoadMore()" [disabled]="!canLoadMore">
      {{ canLoadMore ? 'Xem thêm' : 'Đã hiển thị tất cả' }}
    </button>
    <button class="back-to-top" (click)="onBackToTop()">Quay lại đầu trang</button>
  </div>

</div>
