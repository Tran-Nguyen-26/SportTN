<div class="filter-section">
  <h3>{{ title }}</h3>
  <ul>
    <li *ngFor="let item of visibleItems">
      <label>
        <input
          type="checkbox"
          [checked]="isChecked(item.label)"
          (change)="onToggleItem(item.label, $any($event.target).checked)" />
        {{ item.label }} ({{ item.count }})
      </label>
    </li>
  </ul>
  <button *ngIf="selectedLabels.size > 0" (click)="clearSelection()">Xóa đã chọn</button>
  <button *ngIf="items.length > 5" (click)="toggleShowAll()">
    {{ showAll ? 'Thu gọn' : 'Xem thêm' }}
  </button>
</div>
