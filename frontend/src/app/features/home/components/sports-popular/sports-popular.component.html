<div class="sports-popular">
  <h2>Môn Thể Thao Phổ Biến</h2>
  <div class="sports-list">
    <div class="sport-item" *ngFor="let category of categories">
      <div class="sport-image">
        <img [src]="category.imageUrl" alt="{{ category.name }}">
      </div>
      <span class="sport-name">{{ category.name }}</span>
    </div>
  </div>
</div>
