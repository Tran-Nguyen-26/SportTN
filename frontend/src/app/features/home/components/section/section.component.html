<div class="section">
  <h2>{{ title }}</h2>

  <!-- Banner images -->
  <div class="banner-list">
    <div class="banner-card" *ngFor="let banner of banners">
      <img [src]="banner.image" alt="{{ banner.title }}">
      <h3>{{ banner.title }}</h3>
      <button>Khám phá ngay</button>
    </div>
  </div>

  <!-- Product list -->
  <div class="product-list">
    <app-product-card
      *ngFor="let product of products"
      [product]="product">
    </app-product-card>
  </div>
</div>
