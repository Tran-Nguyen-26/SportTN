<div class="most-searched">
  <h2>{{ title }}</h2>
  <div class="circle-list">
    <div class="circle-item" *ngFor="let product of products">
      <div class="circle">
        <img [src]="product.mainImageUrl" alt="{{ product.name }}">
      </div>
      <span class="product-name">{{ product.name }}</span>
    </div>
  </div>
</div>
