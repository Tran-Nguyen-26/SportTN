<app-auth-form-layout title="Đăng nhập">
  
  <form form-content class="login-form">
    <label for="email">Nhập địa chỉ email</label>
    <input type="email" id="email" placeholder="Email">
    <button type="submit" class="btn-primary">TIẾP</button>
  </form>

  <div footer-link>
    <p>Bạn chưa có tài khoản SportTN? <a routerLink="/auth/register">Đăng ký ngay!</a></p>
  </div>

</app-auth-form-layout>
