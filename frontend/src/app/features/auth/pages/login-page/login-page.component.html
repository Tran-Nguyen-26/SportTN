<app-auth-form-layout title="Login to Your Account">
  <div form-content class="login-form">
    <div *ngIf="errorMessage" class="error-message">
      <mat-icon>error</mat-icon>
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="email@gmail.com">
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')
                    && loginForm.get('email')?.touched">
          Vui lòng nhập email
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')
                    && loginForm.get('email')?.touched">
          Vui lòng điền email đúng định dạng
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Nhập mật khẩu">
        <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')
                    && loginForm.get('password')?.touched">
          Vui lòng nhập mật khẩu
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')
                    && loginForm.get('password')?.touched">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>

      <div class="login-options">
        <mat-checkbox formControlName="rememberMe">Remember me</mat-checkbox>
        <a href="#" (click)="forgotPassword(); $event.preventDefault()" class="forgot-password">Forgot password?</a>
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="!loginForm.valid || isLoading"
        class="full-width login-button">
<!--        <mat-progress-spinner *ngIf="isLoading" diameter="20" mode="indeterminate"></mat-progress-spinner>-->
        <app-loading-spinner *ngIf="isLoading" [diameter]="20"></app-loading-spinner>
        <span *ngIf="!isLoading">Đăng nhập</span>
      </button>
    </form>
  </div>

  <div footer-link>
    <p>Don't have an account? <a routerLink="/auth/register">Đăng ký</a></p>
  </div>
</app-auth-form-layout>
