<app-auth-form-layout title="Đăng ký">
  
  <form form-content class="login-form">
    <label for="email">Đăng ký bằng email</label>
    <input type="email" id="email" placeholder="Email của bạn">
    <button type="submit" class="btn-primary">TIẾP TỤC ĐĂNG KÝ</button>
  </form>

  <div footer-link>
    <p>Đã có tài khoản SportTN? <a routerLink="/auth/login">Đăng nhập</a></p>
  </div>

</app-auth-form-layout>
