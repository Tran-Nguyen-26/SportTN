<div class="login-container">
  <div class="login-header">
    <img src="assets/images/logos/sporttn-logo.png" alt="SportTN Logo" class="logo">
    <h2>{{ title }}</h2>
  </div>

  <ng-content select="[form-content]"></ng-content>

  <div class="social-login">
    <button class="btn-google">Tiếp tục với Google</button>
    <button class="btn-facebook">Tiếp tục với Facebook</button>
    <button class="btn-apple">Tiếp tục với Apple</button>
  </div>

  <div class="signup">
    <ng-content select="[footer-link]"></ng-content>
  </div>

  <div class="benefits">
    <p>Quyền lợi thành viên <strong>SportTN</strong>:</p>
    <ul>
      <li>✔ Tích điểm đổi quà miễn phí</li>
      <li>✔ Nhận thông báo ưu đãi độc quyền</li>
      <li>✔ Đổi trả dễ dàng trong 365 ngày</li>
    </ul>
  </div>

  <footer class="login-footer">
    <a href="#">Hỗ trợ</a> | <a href="#">Bảo mật</a> | <a href="#">Về Trang chủ</a>
  </footer>
</div>
