<div class="cart-container">
  <mat-progress-spinner *ngIf="isLoading" diameter="50" mode="indeterminate"></mat-progress-spinner>

  <div *ngIf="!isLoading && isEmpty" class="empty-cart">
    <mat-card>
      <mat-card-content>
        <div class="empty-state">
          <mat-icon class="empty-icon">shopping_cart</mat-icon>
          <h2>Your Cart is Empty</h2>
          <p>You haven't added any items to your cart yet.</p>
          <button mat-raised-button color="primary" (click)="continueShopping()">
            Continue Shopping
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div *ngIf="!isLoading && !isEmpty" class="cart-content">
    <div class="cart-header">
      <h1>Shopping Cart</h1>
      <p class="items-count">{{ cart.totalItems }} items in your cart</p>
    </div>

    <div class="cart-main">
      <div class="items-section">
        <mat-card>
          <mat-card-content>
            <div class="cart-items-list">
              <app-cart-item 
                *ngFor="let item of cart.items" 
                [item]="item"
                (quantityChanged)="updateQuantity($event.itemId, $event.quantity)"
                (itemRemoved)="removeItem($event)">
              </app-cart-item>
            </div>
          </mat-card-content>
        </mat-card>
      </div>

      <div class="summary-section">
        <app-coupon-input></app-coupon-input>
        <app-order-summary [cart]="cart" (checkout)="proceedToCheckout()"></app-order-summary>
      </div>
    </div>
  </div>
</div>
