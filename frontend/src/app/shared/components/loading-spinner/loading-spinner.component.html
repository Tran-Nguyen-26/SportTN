<div class="spinner-overlay" *ngIf="overlay">
  <div class="spinner-container">
    <mat-progress-spinner
      [diameter]="diameter"
      mode="indeterminate"
      color="primary">
    </mat-progress-spinner>
    <p *ngIf="message" class="loading-text">{{ message }}</p>
  </div>
</div>

<ng-container *ngIf="!overlay">
  <mat-progress-spinner
    [diameter]="diameter"
    mode="indeterminate"
    color="primary">
  </mat-progress-spinner>
</ng-container>
