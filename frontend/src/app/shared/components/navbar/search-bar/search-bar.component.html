<div class="search-bar" [class.focused]="isSearchFocus">
  <mat-icon class="search-icon">search</mat-icon>
  <input
    type="text"
    placeholder="Tìm kiếm sản phẩm, môn thể thao..."
    [(ngModel)]="searchQuery"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown.enter)="onSearch()"
    (input)="onInput()">
  <button class="btn-clear" *ngIf="searchQuery" (mousedown)="clearSearch()">
    <mat-icon>close</mat-icon>
  </button>
  <button class="btn-search" (mousedown)="onSearch()">Tìm</button>

  <div class="search-dropdown" *ngIf="isSearchFocus">

    <div class="search-loading" *ngIf="isLoading">
      <div class="spinner"></div>
      <span>Đang tìm kiếm...</span>
    </div>

    <ng-container *ngIf="!isLoading">

      <div class="search-empty-state" *ngIf="!searchQuery && popularProducts.length > 0">
        <p class="dropdown-label">Sản phẩm phổ biến</p>
        <div class="search-product-grid">
          <app-product-card
            *ngFor="let p of popularProducts"
            [product]="p"
            (openDrawer)="openDrawer(p)">
          </app-product-card>
        </div>
      </div>

      <div class="search-results" *ngIf="searchQuery && searchResults.length > 0">
        <p class="dropdown-label">
          Kết quả cho "<strong>{{ searchQuery }}</strong>"
          <span class="result-count">{{ searchResults.length }} sản phẩm</span>
        </p>
        <div class="search-product-grid">
          <app-product-card
            *ngFor="let p of searchResults"
            [product]="p"
            (openDrawer)="openDrawer(p)">
          </app-product-card>
        </div>
      </div>

      <div class="search-no-result"
           *ngIf="searchQuery && !isLoading && searchResults.length === 0">
        <mat-icon>search_off</mat-icon>
        <p>Không tìm thấy "<strong>{{ searchQuery }}</strong>"</p>
        <span>Hãy thử từ khóa khác</span>
      </div>

    </ng-container>
  </div>
</div>

<app-add-to-cart-drawer
  [isOpen]="drawerOpen"
  [product]="drawerProduct"
  (closed)="closeDrawer()"
  (addedToCart)="onAddedToCart($event)">
</app-add-to-cart-drawer>
