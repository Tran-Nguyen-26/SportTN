<div class="search-bar">
  <img src="assets/images/icons/search-icon.png" alt="">
  <input type="text" placeholder="Tìm kiếm sản phẩm, môn thể thao"
         (focus)="onFocus()"
         (blur)="onBlur()">

  <button *ngIf="isSearchFocus" class="close-search">✕</button>

  <div class="search-results-dropdown" *ngIf="isSearchFocus">
    <div class="search-container">

      <aside class="search-sidebar">
        <section class="search-section">
          <h4>Tìm kiếm gần đây</h4>
          <ul class="suggestion-list">
            <li><span>dây kháng lực</span> <button class="delete-item">✕</button></li>
            <li><span>pickleball</span> <button class="delete-item">✕</button></li>
          </ul>
        </section>

        <section class="search-section">
          <h4>Tìm kiếm phổ biến</h4>
          <ul class="popular-list">
            <li><mat-icon>grid_view</mat-icon> Giá giảm</li>
            <li><mat-icon>grid_view</mat-icon> Sản Phẩm Mới</li>
            <li>
              <mat-icon>pool</mat-icon>
              <div>
                <strong>Bơi lội</strong>
                <small>trong Môn Thể Thao / Thể Thao Dưới Nước</small>
              </div>
            </li>
          </ul>
        </section>
      </aside>

      <main class="search-main">
        <h4>Sản phẩm phổ biến</h4>
        <div *ngIf="isLoading" class="loading-spinner">Đang tải sản phẩm hot...</div>
        <div class="product-search-grid" *ngIf="!isLoading">
          <app-product-card
            *ngFor="let p of popularProducts"
            [product]="p"
          />
        </div>
        <p *ngIf="!isLoading && popularProducts.length === 0" class="empty-msg">
          Hiện chưa có sản phẩm gợi ý nào.
        </p>
      </main>

    </div>
  </div>
</div>
