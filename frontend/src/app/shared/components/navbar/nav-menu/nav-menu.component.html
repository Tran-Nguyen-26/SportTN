<nav class="nav-menu">
    <app-nav-menu-item
        *ngFor="let item of menuItems"
        [label]="item.label"
        [isActive]="activeCategoryId === item.categoryId"
        [highlight]="item.highlight"
        [hasChildren]="item.hasChildren"
        [categoryId]="item.categoryId"
        (itemClick)="onClickMenuItem($event)"
    />
</nav>
