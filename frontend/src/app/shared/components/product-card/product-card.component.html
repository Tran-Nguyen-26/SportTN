<div class="product-card">
  <div class="product-image">
    <img [src]="image" alt="{{ name }}">
    <span class="label" *ngIf="label">{{ label }}</span>
  </div>
  <div class="product-info">
    <h3 class="product-name">{{ name }}</h3>
    <p class="brand">{{ brand }}</p>
    <p class="price">
      <span class="old-price" *ngIf="oldPrice">{{ oldPrice | currency:'VND' }}</span>
      <span class="new-price">{{ newPrice | currency:'VND' }}</span>
    </p>
    <div class="rating" *ngIf="rating">
      <app-rating-stars [rating]="rating"></app-rating-stars>
      {{ rating }} ({{ reviews }} đánh giá)
    </div>
    <div class="product-actions">
      <button mat-raised-button color="primary" (click)="onAddToCart()" class="add-to-cart-btn">
        <mat-icon>shopping_cart</mat-icon>
        Thêm vào giỏ
      </button>
      <button mat-icon-button (click)="onAddToWishlist()" class="wishlist-btn">
        <mat-icon>favorite_border</mat-icon>
      </button>
    </div>
  </div>
</div>
