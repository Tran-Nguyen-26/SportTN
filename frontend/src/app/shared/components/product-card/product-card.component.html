<div class="product-card" (click)="goToProduct()">
  <!-- Old Price Badge -->
  <div class="old-price-badge" *ngIf="oldPrice">
    GIÁ CŨ {{ oldPrice | number:'1.0-0' }}<span class="k">K</span>
  </div>

  <!-- Image and Specs Container -->
  <div class="image-specs-container">
    <!-- Product Image -->
    <div class="product-image">
      <img [src]="image" alt="{{ name }}">
      <span class="label" *ngIf="label">{{ label }}</span>
    </div>

    <!-- Specifications -->
    <div class="specs-section" *ngIf="specs && specs.length > 0">
      <div class="spec-item" *ngFor="let spec of specs">
        <mat-icon class="spec-icon">{{ spec.icon }}</mat-icon>
        <span class="spec-text">{{ spec.text }}</span>
      </div>
    </div>
  </div>

  <!-- Product Info -->
  <div class="product-info">
    <!-- Price -->
    <p class="price">
      <span class="new-price">{{ newPrice | number:'1.0-0' }}đ</span>
    </p>

    <!-- Product Name -->
    <h3 class="product-name">{{ name }}</h3>

    <!-- Brand -->
    <p class="brand">{{ brand }}</p>

    <!-- Rating and Add to Cart -->
    <div class="footer-section">
      <div class="rating" *ngIf="rating">
        <span class="stars">★ {{ rating }}</span>
        <span class="review-count">({{ reviews }})</span>
      </div>
      <button mat-icon-button (click)="onAddToCart()" class="add-to-cart-btn" matTooltip="Thêm vào giỏ">
        <mat-icon>shopping_cart</mat-icon>
      </button>
    </div>
  </div>
</div>
